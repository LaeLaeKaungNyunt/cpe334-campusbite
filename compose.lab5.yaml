# CampusBite Lab 5 local production-container test
# Use together with compose.yaml.
# Local development database credentials only.

services:
  app:
    image: campusbite:lab5
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      COOKIE_SECURE: "false"
      DATABASE_URL: "postgresql://campusbite:campusbite_dev_pw@db-dev:5432/campusbite_dev?schema=public"
    depends_on:
      db-dev:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
